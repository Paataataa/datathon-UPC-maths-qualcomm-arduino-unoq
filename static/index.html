<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studIA</title>
<style>
:root {
  --bg: #f4f6fb; --card: #ffffff; --ink: #1d2433; --muted: #5b6577; --line: #d9deea;
  --brand: #3f51d6; --brand-ink: #ffffff; --ok: #14804a; --ok-bg: #e3f6ec;
  --bad: #b3261e; --bad-bg: #fdeceb; --warn: #8a5a00; --warn-bg: #fff3d6; --focus: #ff9f1c;
  --radius: 14px;
}
/* Temas de la tienda: van antes del modo dislexia para que este tenga prioridad */
body.theme-ocean { --bg: #e8f4fa; --brand: #0b6e99; }
body.theme-forest { --bg: #ecf5ea; --brand: #2f7a3d; }
body.theme-sunset { --bg: #fff1e6; --brand: #b4440e; }
body.theme-candy { --bg: #fbeef7; --brand: #a62582; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
/* Modo dislexia: tema crema de bajo estrés visual, más espacio entre letras, palabras y líneas */
body.dys {
  --bg: #fbf3dc; --card: #fffaec; --ink: #2b2a26; --muted: #5a564a; --line: #e4d8b4;
  font-family: Verdana, "Trebuchet MS", Tahoma, sans-serif;
  letter-spacing: .04em; word-spacing: .14em; line-height: 1.95;
}
body.dys .statement p { margin: 0 0 1.1em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
header {
  position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
}
.brand { font-weight: 800; font-size: 1.35rem; color: var(--brand); display: flex; align-items: center; gap: 8px; }
.pill { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--ink); }
.pill.up { background: var(--ok-bg); color: var(--ok); }
.pill.down { background: var(--bad-bg); color: var(--bad); }
.pill.mock { background: var(--warn-bg); color: var(--warn); }
header label { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
select, input[type=text] {
  font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink);
}
.toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.toggle {
  border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 6px 14px; font-weight: 600;
}
.toggle[aria-pressed=true] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.coins {
  border: 2px solid #e0b100; background: #fff6cc; color: #5a4300; border-radius: 99px; padding: 6px 14px; font-weight: 800;
}
nav.tabs { display: flex; gap: 6px; padding: 12px 16px 0; max-width: 1100px; margin: 0 auto; flex-wrap: wrap; }
nav.tabs button {
  border: 1px solid var(--line); border-bottom: none; background: #e9edf8; color: var(--ink);
  padding: 10px 18px; border-radius: 12px 12px 0 0; font-weight: 700;
}
nav.tabs button[aria-selected=true] { background: var(--card); color: var(--brand); }
main { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
section.panel { background: var(--card); border: 1px solid var(--line); border-radius: 0 var(--radius) var(--radius) var(--radius); padding: 18px; }
section[hidden] { display: none; }
h2 { margin: 0 0 12px; font-size: 1.15rem; }
.muted { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn {
  border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink); border-radius: 10px; padding: 8px 16px; font-weight: 700;
}
.btn.ghost { background: var(--card); color: var(--brand); }
.chip { font-size: .8rem; padding: 2px 10px; border-radius: 99px; background: #e9edf8; color: #2f3b8f; font-weight: 600; }
.grid-topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.topic {
  text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 12px;
}
.topic[aria-pressed=true] { border-color: var(--brand); background: #eef0ff; }
.topic .ico { font-size: 1.6rem; display: block; }
.theory-box { background: #eef0ff; border-left: 5px solid var(--brand); border-radius: 10px; padding: 14px 16px; }
.layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } .toggles { margin-left: 0; } }
.layout > *, .card, main, section.panel { min-width: 0; }
.card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; background: var(--card); }
.statement { font-size: 1.08rem; margin: 10px 0 14px; overflow-wrap: anywhere; }
.statement p { margin: 0 0 .6em; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.steps li label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.steps input { width: 22px; height: 22px; margin-top: 3px; flex: none; accent-color: var(--brand); }
.steps li.done label { background: var(--ok-bg); text-decoration: line-through; color: var(--muted); }
.steps li.goal label { background: #eef0ff; border-color: var(--brand); font-weight: 700; }
.options { display: grid; gap: 8px; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 12px; padding: 10px 14px; font-weight: 600;
}
.opt b { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #e9edf8; color: #2f3b8f; flex: none; }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); opacity: 1; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); opacity: 1; }
.opt.pending { border-color: var(--brand); border-style: dashed; opacity: 1; }
.feedback { margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-weight: 700; }
.feedback.ok { background: var(--ok-bg); color: var(--ok); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback.info { background: #eef0ff; color: #2f3b8f; }
.copilot h2 { display: flex; align-items: center; gap: 8px; }
.quick { display: grid; gap: 8px; margin-bottom: 12px; }
.ask { display: flex; gap: 8px; margin-bottom: 4px; }
.ask input { flex: 1; min-width: 0; }
.counter { font-size: .78rem; color: var(--muted); text-align: right; margin-bottom: 8px; }
.log { display: grid; gap: 10px; }
.ai { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fafbff; overflow-wrap: anywhere; }
.ai.user { background: #eef0ff; margin-left: 24px; }
.ai .kind { font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--brand); margin-bottom: 4px; }
.ai .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.badge { font-size: .76rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: #e9edf8; color: #2f3b8f; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.guard-note { margin-top: 8px; font-size: .9rem; padding: 8px 10px; border-radius: 8px; background: var(--warn-bg); color: #5a3d00; border: 1px solid #e8c36a; }
.thinking { color: var(--muted); font-style: italic; }
.thinking::after { content: ""; display: inline-block; width: 1ch; animation: dots 1.2s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.pomo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 0; padding: 10px 14px; background: #fff3e6; border: 1px solid #f0c9a0; border-radius: 12px; }
.pomo .time { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 4.5ch; }
.pomo.ring { animation: ring 0.6s 4; }
@keyframes ring { 50% { background: #ffd9a8; } }
svg.calc { width: 100%; height: auto; display: block; margin-top: 14px; }
.calc-note { margin-top: 12px; font-size: .9rem; color: var(--muted); }
.bar { display: grid; grid-template-columns: 130px 1fr 40px; gap: 8px; align-items: center; margin: 6px 0; }
.bar .track { background: #e9edf8; border-radius: 6px; height: 18px; overflow: hidden; }
.bar .fill { background: var(--bad); height: 100%; border-radius: 6px; min-width: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.stat { background: #eef0ff; border-radius: 12px; padding: 8px 14px; }
.stat b { display: block; font-size: 1.3rem; }
.progress { height: 10px; border-radius: 99px; background: #e9edf8; overflow: hidden; margin: 8px 0 12px; }
.progress > div { height: 100%; background: var(--brand); transition: width .3s; }
dialog { border: none; border-radius: 18px; padding: 22px; max-width: 460px; width: calc(100% - 32px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(20, 25, 45, .55); }
.avatars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.av { aspect-ratio: 1; display: grid; place-items: center; font-size: 2rem; border-radius: 14px; border: 2px solid var(--line); background: #f4f6fb; padding: 0; color: var(--ink); }
.av.locked { filter: grayscale(1); opacity: .45; }
.av.sel { border-color: var(--brand); background: #eef0ff; }
.reveal { text-align: center; font-size: 4rem; animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.2) rotate(-20deg); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
/* Avatar con marco (cabecera, perfil y tienda) */
.ava-frame { display: inline-grid; place-items: center; width: 1.9em; height: 1.9em; border-radius: 50%; border: 3px solid transparent; background: #f4f6fb; line-height: 1; }
.ava-frame.big { font-size: 3.2rem; }
.ava-frame.frame-gold { border-color: #d4a514; box-shadow: 0 0 0 3px #fff1b8; }
.ava-frame.frame-rainbow { background: linear-gradient(#f4f6fb, #f4f6fb) padding-box, conic-gradient(#e53935, #fb8c00, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935) border-box; }
.ava-frame.frame-stars { border-style: dotted; border-color: #3f51d6; }
.ava-frame.frame-fire { border-color: #e4572e; box-shadow: 0 0 10px #ff8a00; }
.coins .ava-frame { font-size: 1rem; width: 1.7em; height: 1.7em; border-width: 2px; vertical-align: middle; }
/* Tienda */
.shop-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 18px; }
.item { border: 2px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; justify-items: center; text-align: center; background: var(--card); }
.item.owned { border-color: var(--ok); }
.item.equipped { border-color: var(--brand); background: #eef0ff; }
.item .prev { font-size: 2rem; min-height: 2.4rem; display: grid; place-items: center; }
.item .price { font-weight: 800; color: #5a4300; }
.swatch { width: 54px; height: 34px; border-radius: 8px; border: 1px solid var(--line); }
.title-tag { font-size: .85rem; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: var(--brand); color: var(--brand-ink); }
.gacha-box { border: 2px dashed #e0b100; background: #fffbea; border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
.reel { height: 4.2rem; overflow: hidden; display: grid; place-items: center; font-size: 3rem; }
.reel.spin span { animation: reel .12s linear infinite; }
@keyframes reel { from { transform: translateY(-40%); } to { transform: translateY(40%); } }
/* Perfil */
.profile-top { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; margin-bottom: 14px; }
.slot { margin: 14px 0; }
.slot .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.choice { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 6px 12px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.choice[aria-pressed=true] { border-color: var(--brand); background: #eef0ff; }
.test-result { display: grid; gap: 8px; }
.sr { position: absolute; left: -9999px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">🧮 studIA <span class="pill" id="status">…</span></div>
  <label><span data-i18n="language">Idioma</span>
    <select id="lang"><option value="cat">Català</option><option value="esp">Español</option><option value="eng">English</option></select></label>
  <label><span data-i18n="level">Nivel</span>
    <select id="level"></select></label>
  <div class="toggles" role="group" aria-label="Accessibility">
    <button class="toggle" id="t-tdah" aria-pressed="false"></button>
    <button class="toggle" id="t-dys" aria-pressed="false"></button>
    <button class="toggle" id="t-calc" aria-pressed="false"></button>
  </div>
  <button class="coins" id="coinsBtn">🪙 <span id="coins">0</span> <span id="avatarNow"></span></button>
</header>

<div id="pomodoro" class="pomo" hidden style="max-width:1068px;margin:12px auto 0">
  <span aria-hidden="true">🍅</span><strong data-i18n="pomodoro">Pomodoro</strong>
  <span class="time" id="pomoTime" role="timer">25:00</span>
  <select id="pomoMin" aria-label="minutes"><option value="1">1 min</option><option value="5">5 min</option><option value="15">15 min</option><option value="25" selected>25 min</option></select>
  <button class="btn" id="pomoStart"></button>
  <button class="btn ghost" id="pomoReset">↺</button>
  <span class="muted" id="pomoMsg" aria-live="polite"></span>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab-learn" aria-selected="false" data-tab="learn"></button>
  <button role="tab" id="tab-practice" aria-selected="true" data-tab="practice"></button>
  <button role="tab" id="tab-test" aria-selected="false" data-tab="test"></button>
  <button role="tab" id="tab-shop" aria-selected="false" data-tab="shop"></button>
  <button role="tab" id="tab-profile" aria-selected="false" data-tab="profile"></button>
</nav>

<main>
  <!-- 1. APRENDER -->
  <section class="panel" id="learn" role="tabpanel" hidden>
    <h2 data-i18n="learnTitle"></h2>
    <div class="grid-topics" id="topicGrid"></div>
    <div class="theory-box" id="theoryBox"></div>
    <p><button class="btn" id="practiceTopic"></button></p>
  </section>

  <!-- 2. PRACTICAR -->
  <section class="panel" id="practice" role="tabpanel">
    <div class="row" style="margin-bottom:12px">
      <label class="muted"><span data-i18n="topic"></span>
        <select id="topicSel"></select></label>
      <button class="btn ghost" id="newProblem"></button>
    </div>
    <div class="layout">
      <div class="card" id="pCard"><p class="thinking" data-i18n="loading"></p></div>
      <div class="card copilot">
        <h2>🤖 <span data-i18n="copilot"></span></h2>
        <div class="quick">
          <button class="btn ghost" id="bTheory"></button>
          <button class="btn ghost" id="bSimilar"></button>
          <button class="btn ghost" id="bHint"></button>
        </div>
        <form class="ask" id="askForm">
          <input type="text" id="askInput" maxlength="80" autocomplete="off" aria-label="question">
          <button class="btn" id="askBtn" type="submit"></button>
        </form>
        <div class="counter"><span id="askCount">0</span>/80</div>
        <div class="log" id="log" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- 3. TEST -->
  <section class="panel" id="test" role="tabpanel" hidden>
    <div id="testIntro">
      <h2 data-i18n="testTitle"></h2>
      <p class="muted" data-i18n="testIntro"></p>
      <button class="btn" id="testStart"></button>
    </div>
    <div id="testRun" hidden>
      <div class="row"><span class="chip" id="testLevel"></span><span class="muted" id="testCount"></span></div>
      <div class="progress"><div id="testBar" style="width:0"></div></div>
      <div class="card" id="tCard"></div>
      <div id="tFeedback" aria-live="polite"></div>
    </div>
    <div id="testDone" hidden></div>
    <hr style="border:none;border-top:1px solid var(--line);margin:20px 0">
    <h2 data-i18n="analytics"></h2>
    <div id="analytics"></div>
  </section>

  <!-- 4. TIENDA -->
  <section class="panel" id="shop" role="tabpanel" hidden>
    <div class="shop-head">
      <h2 data-i18n="shopTitle"></h2>
      <span class="coins" id="shopCoins"></span>
    </div>
    <div class="gacha-box">
      <div class="row" style="justify-content:space-between">
        <strong>🎰 <span data-i18n="gachaTitle"></span></strong>
        <button class="btn" id="gPull"></button>
      </div>
      <p class="muted" id="gInfo" style="margin:0"></p>
      <div id="gReveal" aria-live="polite"></div>
    </div>
    <div id="shopBody"></div>
  </section>

  <!-- 5. PERFIL -->
  <section class="panel" id="profile" role="tabpanel" hidden>
    <div class="profile-top" id="profileTop"></div>
    <div class="stats" id="profileStats"></div>
    <div id="profileSlots"></div>
  </section>
</main>

<script>

/* ---------- representación del problema ---------- */
const STEP_RE = /^(Pas|Paso|Step)\s+\d+:\s*/i, GOAL_RE = /^(Objectiu final|Objetivo final|Final goal):\s*/i;
const stripNo = s => String(s || '').replace(/^\s*\d+\.\s+/, '');

function statementNode(p) {
  const box = el('div', { class: 'statement' });
  if (S.modes.tdah && p.text_tdah) {
    const lines = p.text_tdah.split('\n').map(s => s.trim()).filter(Boolean);
    if (lines.some(l => STEP_RE.test(l))) {
      const ul = el('ul', { class: 'steps' });
      lines.forEach((line, i) => {
        const goal = GOAL_RE.test(line);
        const m = line.match(goal ? GOAL_RE : STEP_RE);
        const li = el('li', { class: goal ? 'goal' : '' });
        const cb = el('input', { type: 'checkbox', id: 'st' + i, onchange: () => li.classList.toggle('done', cb.checked) });
        const label = el('label', { for: 'st' + i }, cb, el('span', {}, m ? el('b', {}, m[0]) : '', m ? line.slice(m[0].length) : line));
        li.append(label); ul.append(li);
      });
      box.append(ul); return box;
    }
  }
  const src = S.modes.dys && p.text_dyslexia ? p.text_dyslexia : stripNo(p.text || p.original_text);
  const parts = S.modes.dys ? src.split(/\n{2,}/) : [src];
  parts.forEach(x => box.append(el('p', {}, x)));
  return box;
}

function optionsNode(p, onPick) {
  const wrap = el('div', { class: 'options', role: 'group' });
  Object.keys(p.options).sort().forEach(letter => {
    wrap.append(el('button', { class: 'opt', 'data-letter': letter, onclick: () => onPick(letter) }, el('b', {}, letter), el('span', {}, String(p.options[letter]))));
  });
  return wrap;
}

function numberOf(str) {
  const m = String(str).replace(/\s+/g, ' ').match(/-?\d+(?:[.,]\d+)?(?:\s?\/\s?\d+)?/);
  if (!m) return null;
  let s = m[0];
  if (s.includes('/')) { const [a, b] = s.split('/').map(x => parseFloat(x.replace(',', '.'))); return b ? a / b : null; }
  return parseFloat(s.replace(',', '.'));
}

function calcNode(p) {
  const letters = Object.keys(p.options).sort();
  const vals = letters.map(l => numberOf(p.options[l]));
  if (!letters.length || vals.some(v => v === null || !isFinite(v))) return el('div', { class: 'calc-note' }, t('calcNote'));
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, a) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); return n; };
  const colors = ['#3f51d6', '#c2410c', '#0f766e', '#a21caf', '#4d7c0f'];
  const max = Math.max(...vals.map(Math.abs)) || 1;
  const blocks = vals.every(v => Number.isInteger(v) && v >= 0 && v <= 20) && max > 0;
  const rowH = blocks ? 34 : 38, W = 640, labelW = 120, H = letters.length * rowH + 8;
  const svg = mk('svg', { class: 'calc', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': t('calcTitle') });
  const title = mk('title', {}); title.textContent = t('calcTitle'); svg.append(title);
  letters.forEach((l, i) => {
    const y = 4 + i * rowH, c = colors[i % colors.length], v = vals[i];
    const lab = mk('text', { x: 4, y: y + 22, 'font-size': 16, 'font-weight': 700, fill: 'currentColor' });
    lab.textContent = `${l}) ${String(p.options[l]).slice(0, 14)}`; svg.append(lab);
    if (blocks) {
      for (let k = 0; k < v; k++) svg.append(mk('rect', { x: labelW + 20 + k * 22 + Math.floor(k / 5) * 8, y: y + 4, width: 18, height: 22, rx: 4, fill: c }));
    } else {
      const w = Math.max(3, Math.abs(v) / max * (W - labelW - 70));
      svg.append(mk('rect', { x: labelW + 20, y: y + 4, width: w, height: 24, rx: 6, fill: c }));
      const val = mk('text', { x: labelW + 28 + w, y: y + 22, 'font-size': 14, fill: 'currentColor' }); val.textContent = String(v); svg.append(val);
    }
  });
  return svg;
}

function problemMeta(p) {
  const topic = ((S.theory && S.theory.topics) || []).find(x => x.topic === p.topic);
  return el('div', { class: 'row' }, el('span', { class: 'chip' }, '#' + p.id), el('span', { class: 'chip' }, t('level') + ' ' + p.level),
    topic ? el('span', { class: 'chip' }, (TOPIC_ICON[p.topic] || '') + ' ' + topic.name) : null);
}

/* ---------- PRACTICAR ---------- */
function renderPractice() {
  const p = S.problem, card = $('#pCard');
  if (!p) return;
  const done = S.solved;
  const opts = optionsNode(p, pickPractice);
  opts.querySelectorAll('.opt').forEach(b => {
    if (S.wrongSet.has(b.dataset.letter)) { b.classList.add('wrong'); b.disabled = true; }
    if (done) b.disabled = true;
    if (done && b.dataset.letter === S.solved) b.classList.add('right');
  });
  card.replaceChildren(problemMeta(p), statementNode(p), opts, S.modes.calc ? calcNode(p) : '', el('div', { id: 'pFeedback', 'aria-live': 'polite' }));
  if (S.feedback) showFeedback(S.feedback.kind, S.feedback.text, S.feedback.next);
}

function showFeedback(kind, text, withNext) {
  S.feedback = { kind, text, next: withNext };
  const box = $('#pFeedback'); if (!box) return;
  box.replaceChildren(el('div', { class: 'feedback ' + kind }, text),
    withNext ? el('p', {}, el('button', { class: 'btn', onclick: () => loadPractice(true) }, t('next'))) : '');
}

async function loadPractice(fresh, keepId) {
  S.wrongSet = new Set(); S.solved = false; S.feedback = null;
  $('#log').replaceChildren();
  $('#pCard').replaceChildren(el('p', { class: 'thinking' }, t('loading')));
  try {
    const q = keepId && S.problem
      ? { id: S.problem.id, language: S.lang, mode: 'practice' }
      : { language: S.lang, level: S.level, topic: S.topic, mode: 'practice', skip: S.problem && S.problem.id };
    S.problem = await api('/api/problem?' + qs(q));
    renderPractice();
  } catch (e) {
    S.problem = null;
    $('#pCard').replaceChildren(el('div', { class: 'feedback bad' }, e.message.includes('filtros') || e.message.includes('filters') ? t('noProblems') : e.message));
  }
}

async function pickPractice(letter) {
  if (!S.problem || S.solved || S.checking) return;
  S.checking = true;
  const p = S.problem;
  const btn = $(`#pCard .opt[data-letter="${letter}"]`);
  if (btn) btn.classList.add('pending');
  try {
    // El servidor corrige al instante (no espera al LLM): el rojo sale enseguida.
    const r = await api('/api/check', { problem_id: p.id, language: S.lang, choice: letter, mode: 'practice' });
    if (S.problem !== p) return;
    if (r.correct) {
      S.solved = letter;
      renderPractice();
      showFeedback('ok', t('correct') + (r.coins_earned ? `  +${r.coins_earned} 🪙` : ''), true);
    } else {
      S.wrongSet.add(letter);
      renderPractice();
      showFeedback('bad', t('wrong'));
      if (r.explain) explainWrong(p, letter);
    }
    refreshProgress();
  } catch (e) { if (btn) btn.classList.remove('pending'); showFeedback('bad', e.message); } finally { S.checking = false; }
}

async function explainWrong(p, letter) {
  // Normalmente ya está precalculada desde que se cargó el problema.
  const log = $('#log');
  const wait = el('div', { class: 'ai thinking' }, t('explaining'));
  log.prepend(wait);
  try {
    const r = await api('/api/explain', { problem_id: p.id, language: S.lang, choice: letter, mode: 'practice' });
    if (S.problem === p) addAi('explain', r);
  } catch (e) { if (S.problem === p) log.prepend(el('div', { class: 'ai' }, el('div', { class: 'feedback bad' }, e.message))); }
  finally { wait.remove(); }
}

/* ---------- panel del copiloto ---------- */
function setCopilotBusy(on) {
  ['#bTheory', '#bSimilar', '#bHint', '#askBtn', '#askInput'].forEach(s => { $(s).disabled = on; });
}
function guardBlock(r) {
  const noModel = r.status && r.status.startsWith('error');
  const badges = [];
  const shown = r.waited != null ? r.waited : r.seconds;  // lo que esperó el alumno
  if (shown != null) badges.push(el('span', { class: 'badge' }, `⏱ ${t('latency')}: ${Number(shown).toFixed(1)} s`));
  if (r.precomputed) badges.push(el('span', { class: 'badge ok' }, '⚡ ' + t('precomputed')));
  if (r.leaked_and_blocked) badges.push(el('span', { class: 'badge warn' }, '🛡️ ' + t('guardBlocked') + (r.block_reason ? ` (${r.block_reason})` : '')));
  else if (noModel) badges.push(el('span', { class: 'badge warn' }, '⚠️ ' + t('guardNoModel')));
  else badges.push(el('span', { class: 'badge ok' }, '🛡️ ' + t('guardOk')));
  const note = r.leaked_and_blocked
    ? el('div', { class: 'guard-note' }, r.block_reason === 'injection' ? t('guardInj') : t('guardLeak')) : null;
  return [el('div', { class: 'meta' }, badges), note];
}
function addAi(kind, r, question) {
  const log = $('#log');
  if (question) log.prepend(el('div', { class: 'ai user' }, el('div', { class: 'kind' }, t('doubtKind')), question));
  const kinds = { hint: 'hintKind', doubt: 'hintKind', explain: 'explainKind' };
  log.prepend(el('div', { class: 'ai' }, el('div', { class: 'kind' }, '🤖 ' + t(kinds[kind] || 'hintKind')), r.text, ...guardBlock(r)));
  while (log.children.length > 8) log.lastChild.remove();
}
async function withThinking(fn) {
  if (!S.problem || S.busy) return;
  S.busy = true; setCopilotBusy(true);
  const log = $('#log');
  const wait = el('div', { class: 'ai thinking' }, t('thinking'));
  log.prepend(wait);
  try { await fn(); } catch (e) { log.prepend(el('div', { class: 'ai' }, el('div', { class: 'feedback bad' }, e.message))); }
  finally { wait.remove(); S.busy = false; setCopilotBusy(false); }
}

};
$('#bSimilar').onclick = () => withThinking(async () => {
  const r = await api('/api/similar?' + qs({ problem_id: S.problem.id, language: S.lang, mode: 'practice' }));
  const meta = el('div', { class: 'meta' }, el('span', { class: 'badge' }, `⏱ ${t('latency')}: ${Number(r.seconds).toFixed(2)} s`),
    r.similarity != null ? el('span', { class: 'badge' }, `${t('similarity')} ${Number(r.similarity).toFixed(2)}`) : null);
  if (!r.example) { $('#log').prepend(el('div', { class: 'ai' }, t('noExample'), meta)); return; }
  const ex = r.example;
  const opts = Object.keys(ex.options || {}).sort().map(l => el('div', {}, `${l}) ${ex.options[l]}`));
  $('#log').prepend(el('div', { class: 'ai' }, el('div', { class: 'kind' }, `🔍 ${t('similarKind')} · ${t('level')} ${ex.level}`),
    el('div', {}, stripNo(ex.text)), el('div', { class: 'muted', style: 'margin:6px 0' }, opts),
    el('div', {}, el('b', {}, `${t('answerWas')}: ${ex.answer}) ${ex.answer_text}`)), meta));
});
async function askLlm(question) {
  await withThinking(async () => {
    const r = await api('/api/hint', { problem_id: S.problem.id, language: S.lang, question: question || null, mode: 'practice' });
    addAi(question ? 'doubt' : 'hint', r, question);
  });
}
$('#bHint').onclick = () => askLlm(null);
$('#askForm').onsubmit = e => {
  e.preventDefault();
  const q = $('#askInput').value.trim().slice(0, 80);
  if (!q) return;
  $('#askInput').value = ''; $('#askCount').textContent = '0';
  askLlm(q);
};
$('#askInput').oninput = e => { $('#askCount').textContent = String(e.target.value.length); };
$('#newProblem').onclick = () => loadPractice(true);
$('#topicSel').onchange = e => { S.topic = e.target.value; loadPractice(true); };

/* ---------- APRENDER ---------- */
function renderLearn() {
  const grid = $('#topicGrid'), box = $('#theoryBox');
  if (!S.theory) return;
  const cur = S.topic || S.theory.topics[0].topic;
  grid.replaceChildren(...S.theory.topics.map(x => el('button', {
    class: 'topic', 'aria-pressed': String(x.topic === cur),
    onclick: () => { S.topic = x.topic; $('#topicSel').value = x.topic; renderLearn(); },
  }, el('span', { class: 'ico', 'aria-hidden': 'true' }, TOPIC_ICON[x.topic] || '📚'), el('b', {}, x.name))));
  const sel = S.theory.topics.find(x => x.topic === cur);
  box.replaceChildren(el('b', {}, `${TOPIC_ICON[cur] || ''} ${sel.name}`), el('p', { style: 'margin:.5em 0 0' }, sel.content));
}
$('#practiceTopic').onclick = () => {
  if (!S.topic && S.theory) S.topic = S.theory.topics[0].topic;
  $('#topicSel').value = S.topic; switchTab('practice'); loadPractice(true);
};

/* ---------- TEST ---------- */
function testShow(which) {
  $('#testIntro').hidden = which !== 'intro'; $('#testRun').hidden = which !== 'run'; $('#testDone').hidden = which !== 'done';
}
function renderTestIntro() {
  const p = S.progress;
  const box = $('#testIntro .muted');
  if (box) box.replaceChildren(t('testIntro'), el('br'), '🪙 ' + fill(t('testCoins'), {
    p: p ? p.test_pass_pct : 50, m: p ? p.test_max_coins : 120, c: p ? p.coins_per_correct : 10 }));
}
async function testStart() {
  Object.assign(S.test, { active: true, n: 0, right: 0, level: S.level, problem: null, answered: false, session: null });
  testShow('run'); $('#tFeedback').replaceChildren();
  try {
    const r = await api('/api/test/start', { language: S.lang, level: S.level });
    Object.assign(S.test, { session: r.session, total: r.total, problem: r.problem });
    renderTest();
  } catch (e) { testShow('intro'); $('#testIntro').append(el('div', { class: 'feedback bad' }, e.message)); }
}
function renderTest() {
  const T_ = S.test, p = T_.problem; if (!p) return;
  $('#testLevel').textContent = `${t('testNow')} ${p.level}`;
  $('#testCount').textContent = `${t('testQ')} ${T_.n + 1}/${T_.total}`;
  $('#testBar').style.width = (T_.n / T_.total * 100) + '%';
  const opts = optionsNode(p, pickTest);
  opts.querySelectorAll('.opt').forEach(b => { b.disabled = T_.answered; });
  $('#tCard').replaceChildren(problemMeta(p), statementNode(p), opts, S.modes.calc ? calcNode(p) : '');
}
async function pickTest(letter) {
  const T_ = S.test; if (T_.answered || !T_.problem) return;
  T_.answered = true; renderTest();
  try {
    const r = await api('/api/check', { problem_id: T_.problem.id, language: S.lang, choice: letter, mode: 'test', session: T_.session });
    if (r.correct) T_.right++;
    T_.n++;
    $('#testBar').style.width = (T_.n / T_.total * 100) + '%';
    const b = $(`#tCard .opt[data-letter="${letter}"]`);
    if (b) b.classList.add(r.correct ? 'right' : 'wrong');
    $('#tFeedback').replaceChildren(el('div', { class: 'feedback ' + (r.correct ? 'ok' : 'bad') }, r.correct ? t('testRight') : t('testWrong')));
    const nxt = r.next;
    if (r.test_done) { setTimeout(() => testFinish(r.test_done), 900); return; }
    setTimeout(() => {
      T_.problem = nxt.problem; T_.level = nxt.target_level; T_.answered = false;
      $('#tFeedback').replaceChildren(); renderTest();
    }, 1000);
  } catch (e) { T_.answered = false; renderTest(); $('#tFeedback').replaceChildren(el('div', { class: 'feedback bad' }, e.message)); }
}
function testFinish(d) {
  S.test.active = false; testShow('done');
  $('#testDone').replaceChildren(el('h2', {}, '🏁 ' + t('testDone')),
    el('div', { class: 'stats' },
      el('div', { class: 'stat' }, t('testScore'), el('b', {}, `${d.right}/${d.n}`)),
      el('div', { class: 'stat' }, t('testGrade'), el('b', {}, d.grade_pct + '%')),
      el('div', { class: 'stat' }, t('testNow'), el('b', {}, String(S.test.level))),
      el('div', { class: 'stat' }, t('coinsEarned'), el('b', {}, '🪙 +' + d.coins_earned))),
    el('div', { class: 'feedback ' + (d.passed ? 'ok' : 'bad') }, d.passed ? '🎉 ' + t('testPassed') : fill(t('testFailed'), { p: d.pass_pct })),
    d.ran_out ? el('p', { class: 'muted' }, t('testNoMore')) : '',
    el('p', {}, el('button', { class: 'btn', onclick: () => { testShow('intro'); } }, t('testAgain'))));
  refreshProgress();
}
$('#testStart').onclick = testStart;

/* ---------- progreso, analíticas y gacha ---------- */
async function refreshProgress() {
  try { S.shop = await api('/api/shop'); } catch { return; }
  S.progress = S.shop;
  applyLook(); renderAnalytics(); renderTestIntro(); renderShop(); renderProfile();
}

/* Lo equipado: avatar y marco en la cabecera, tema de colores en toda la página */
const itemName = id => (ITEM_NAMES[S.lang] && ITEM_NAMES[S.lang][id]) || ITEM_NAMES.eng[id] || id;
function avatarNode(big) {
  const eq = (S.shop && S.shop.equipped) || {};
  const frame = eq.frame ? ' ' + eq.frame.replace(':', '-') : '';
  return el('span', { class: 'ava-frame' + (big ? ' big' : '') + frame, role: 'img', 'aria-label': eq.avatar ? itemName(eq.avatar) : 'avatar' },
    eq.avatar ? AVATAR_EMOJI[eq.avatar] || '🎭' : '🙂');
}
function applyLook() {
  const eq = (S.shop && S.shop.equipped) || {};
  [...document.body.classList].filter(c => c.startsWith('theme-')).forEach(c => document.body.classList.remove(c));
  if (eq.theme) document.body.classList.add(eq.theme.replace(':', '-'));
  $('#coins').textContent = S.shop.coins;
  $('#avatarNow').replaceChildren(avatarNode(false));
}
function itemPreview(it) {
  if (it.kind === 'avatar') return el('div', { class: 'prev' }, AVATAR_EMOJI[it.id] || '🎭');
  if (it.kind === 'theme') return el('div', { class: 'prev' }, el('div', { class: 'swatch', style: `background:${THEME_SWATCH[it.id]}` }));
  if (it.kind === 'frame') return el('div', { class: 'prev' }, el('span', { class: 'ava-frame ' + it.id.replace(':', '-') }, '🙂'));
  return el('div', { class: 'prev' }, el('span', { class: 'title-tag' }, itemName(it.id)));
}

/* ---------- TIENDA ---------- */
function renderShop() {
  const s = S.shop; if (!s) return;
  $('#shopCoins').textContent = '🪙 ' + s.coins;
  const locked = s.items.filter(i => !i.owned).length;
  $('#gInfo').textContent = locked ? fill(t('gInfo'), { c: s.gacha_cost }) : t('gAll');
  $('#gPull').textContent = S.spinning ? t('gSpin') : fill(t('gPull'), { c: s.gacha_cost });
  $('#gPull').disabled = S.spinning || !locked || s.coins < s.gacha_cost;
  const body = $('#shopBody');
  body.replaceChildren(...['avatar', 'theme', 'frame', 'title'].flatMap(kind => [
    el('h3', { style: 'margin:14px 0 0;font-size:1rem' }, KIND_ICON[kind] + ' ' + t('k_' + kind)),
    el('div', { class: 'shop-grid' }, s.items.filter(i => i.kind === kind).map(it => el('div', {
      class: 'item' + (it.owned ? ' owned' : '') + (it.equipped ? ' equipped' : ''),
    }, itemPreview(it), el('b', {}, itemName(it.id)),
      it.owned
        ? el('button', { class: 'btn' + (it.equipped ? '' : ' ghost'), disabled: it.equipped, onclick: () => equip(kind, it.id) }, it.equipped ? t('equipped') : t('equip'))
        : el('button', { class: 'btn', disabled: s.coins < it.price, title: s.coins < it.price ? t('notEnough') : null, onclick: () => buy(it.id) },
          `${t('buy')} · ${it.price} 🪙`)))),
  ]));
}
async function buy(id) {
  try { S.shop = await api('/api/buy', { item: id }); S.progress = S.shop; applyLook(); renderShop(); renderProfile(); renderAnalytics(); }
  catch (e) { $('#gReveal').replaceChildren(el('div', { class: 'feedback bad' }, e.message)); }
}
async function equip(slot, id) {
  try { S.shop = await api('/api/equip', { slot, item: id }); S.progress = S.shop; applyLook(); renderShop(); renderProfile(); }
  catch (e) { $('#gReveal').replaceChildren(el('div', { class: 'feedback bad' }, e.message)); }
}
$('#gPull').onclick = async () => {
  if (S.spinning) return;
  S.spinning = true; renderShop();
  // Rodillo en la página mientras la matriz LED hace su propia tirada (~3,5 s).
  const pool = Object.values(AVATAR_EMOJI).concat(['🎨', '🖼️', '🏷️']);
  const reel = el('div', { class: 'reel spin' }, el('span', {}, pool[0]));
  $('#gReveal').replaceChildren(reel);
  let i = 0; const spin = setInterval(() => { reel.firstChild.textContent = pool[i++ % pool.length]; }, 120);
  try {
    const [r] = await Promise.all([api('/api/gacha', {}), new Promise(ok => setTimeout(ok, 3500))]);
    clearInterval(spin);
    S.shop = r.shop; S.progress = r.shop;
    const it = S.shop.items.find(x => x.id === r.item) || { id: r.item, kind: r.kind };
    $('#gReveal').replaceChildren(el('div', { class: 'reveal' }, itemPreview(it)),
      el('p', { style: 'text-align:center;margin:0' }, `${t('gWon')} `, el('b', {}, itemName(r.item)), ` (${t('k_' + r.kind)})`),
      el('p', { style: 'text-align:center' }, el('button', { class: 'btn', onclick: () => equip(r.kind, r.item) }, t('equip'))));
  } catch (e) { clearInterval(spin); $('#gReveal').replaceChildren(el('div', { class: 'feedback bad' }, e.message)); }
  finally { S.spinning = false; applyLook(); renderShop(); renderProfile(); renderAnalytics(); }
};

/* ---------- PERFIL ---------- */
function renderProfile() {
  const s = S.shop; if (!s) return;
  const eq = s.equipped || {};
  const acc = s.attempts ? Math.round(100 * s.correct / s.attempts) + '%' : '–';
  $('#profileTop').replaceChildren(avatarNode(true), el('div', {},
    el('div', { class: 'muted' }, t('student')), el('h2', { style: 'margin:0' }, s.username),
    eq.title ? el('span', { class: 'title-tag' }, itemName(eq.title)) : null));
  $('#profileStats').replaceChildren(
    el('div', { class: 'stat' }, t('attempts'), el('b', {}, String(s.attempts))),
    el('div', { class: 'stat' }, t('accuracy'), el('b', {}, acc)),
    el('div', { class: 'stat' }, t('testNow'), el('b', {}, String(s.current_level))),
    el('div', { class: 'stat' }, t('coinsL'), el('b', {}, '🪙 ' + s.coins)),
    el('div', { class: 'stat' }, t('owned'), el('b', {}, `${s.owned.length}/${s.items.length}`)));
  $('#profileSlots').replaceChildren(el('p', { class: 'muted' }, t('profileHint')), ...['avatar', 'theme', 'frame', 'title'].map(kind => {
    const mine = s.items.filter(i => i.kind === kind && i.owned);
    const label = it => kind === 'avatar' ? `${AVATAR_EMOJI[it.id] || ''} ${itemName(it.id)}` : `${KIND_ICON[kind]} ${itemName(it.id)}`;
    return el('div', { class: 'slot' }, el('b', {}, KIND_ICON[kind] + ' ' + t('k_' + kind)), el('div', { class: 'choices' },
      el('button', { class: 'choice', 'aria-pressed': String(!eq[kind]), onclick: () => equip(kind, null) }, t('none')),
      mine.map(it => el('button', { class: 'choice', 'aria-pressed': String(eq[kind] === it.id), onclick: () => equip(kind, it.id) }, label(it)))));
  }));
}
function renderAnalytics() {
  const p = S.progress, box = $('#analytics'); if (!p) return;
  const names = {}; ((S.theory && S.theory.topics) || []).forEach(x => { names[x.topic] = x.name; });
  const topics = Object.keys(names).length ? Object.keys(names) : Object.keys(p.errors_by_topic);
  const max = Math.max(1, ...topics.map(k => p.errors_by_topic[k] || 0));
  const acc = p.attempts ? Math.round(100 * p.correct / p.attempts) : 0;
  const total = Object.values(p.errors_by_topic).reduce((a, b) => a + b, 0);
  box.replaceChildren(
    el('div', { class: 'stats' },
      el('div', { class: 'stat' }, t('attempts'), el('b', {}, String(p.attempts))),
      el('div', { class: 'stat' }, t('accuracy'), el('b', {}, p.attempts ? acc + '%' : '–')),
      el('div', { class: 'stat' }, t('testNow'), el('b', {}, String(p.current_level))),
      el('div', { class: 'stat' }, t('coinsL'), el('b', {}, '🪙 ' + p.coins))),
    el('h3', { style: 'margin:12px 0 4px;font-size:1rem' }, t('errorsBy')),
    total ? el('div', {}, topics.map(k => {
      const n = p.errors_by_topic[k] || 0;
      return el('div', { class: 'bar' }, el('span', {}, (TOPIC_ICON[k] || '') + ' ' + (names[k] || k)),
        el('div', { class: 'track' }, el('div', { class: 'fill', style: `width:${n / max * 100}%` })), el('b', {}, String(n)));
    })) : el('p', { class: 'muted' }, t('noErrors')));
}
$('#coinsBtn').onclick = () => switchTab('shop');

/* ---------- Pomodoro (modo TDAH) ---------- */
const pomo = { running: false, left: 25 * 60, timer: null };
function pomoDraw() {
  const m = Math.floor(pomo.left / 60), s = pomo.left % 60;
  $('#pomoTime').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  $('#pomoStart').textContent = pomo.running ? t('pause') : t('start');
}
// La matriz LED lleva su propia cuenta atrás: le decimos los segundos que quedan y el total.
function pomoEvent(action) {
  const total = Number($('#pomoMin').value) * 60;
  api('/api/event', { event: 'pomodoro', payload: { action, seconds: Math.max(0, pomo.left), total } }).catch(() => {});
}
function pomoReset() {
  clearInterval(pomo.timer); pomo.running = false; pomo.left = Number($('#pomoMin').value) * 60; $('#pomoMsg').textContent = ''; pomoDraw();
  pomoEvent('reset');
}
$('#pomoMin').onchange = pomoReset;
$('#pomoReset').onclick = pomoReset;
$('#pomoStart').onclick = () => {
  if (pomo.running) { clearInterval(pomo.timer); pomo.running = false; pomoDraw(); pomoEvent('pause'); return; }
  if (pomo.left <= 0) pomoReset();
  pomo.running = true; $('#pomoMsg').textContent = t('pomoGo');
  pomoEvent('start');
  pomo.timer = setInterval(() => {
    pomo.left--; pomoDraw();
    if (pomo.left <= 0) {
      clearInterval(pomo.timer); pomo.running = false; $('#pomoMsg').textContent = t('pomoDone');
      $('#pomodoro').classList.add('ring'); setTimeout(() => $('#pomodoro').classList.remove('ring'), 2500);
      pomoEvent('end'); pomoDraw();
    }
  }, 1000);
  pomoDraw();
};

/* ---------- pestañas, filtros, idioma ---------- */
function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('[role=tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  ['learn', 'practice', 'test', 'shop', 'profile'].forEach(id => { $('#' + id).hidden = id !== tab; });
  if (tab === 'learn') renderLearn();
  if (tab === 'test' || tab === 'shop' || tab === 'profile') refreshProgress();
}
document.querySelectorAll('[role=tab]').forEach(b => { b.onclick = () => switchTab(b.dataset.tab); });

function rerender() {
  if (S.problem) renderPractice();
  if (S.test.problem && !$('#testRun').hidden) renderTest();
}
for (const k of ['tdah', 'dys', 'calc']) {
  $('#t-' + k).onclick = () => {
    S.modes[k] = !S.modes[k]; applyModes(); rerender();
    if (k === 'calc' && S.modes.calc) api('/api/event', { event: 'dyscalculia', payload: { on: true } }).catch(() => {});
  };
}
$('#level').onchange = e => { S.level = Number(e.target.value); store.set('level', S.level); if (S.tab === 'practice') loadPractice(true); };
$('#lang').onchange = async e => {
  S.lang = e.target.value; store.set('lang', S.lang);
  await loadTheory(); applyStatic(); renderLearn(); renderAnalytics(); renderShop(); renderProfile();
  if (S.tab === 'practice' && S.problem) loadPractice(true, true);
  if (S.test.problem && !$('#testRun').hidden && !S.test.answered) {
    try {
      S.test.problem = await api('/api/problem?' + qs({ id: S.test.problem.id, language: S.lang, mode: 'test', session: S.test.session }));
      renderTest();
    } catch { /* se queda como estaba */ }
  }
};
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  const l = e.key.toUpperCase();
  if (!'ABCDE'.includes(l) || l.length !== 1) return;
  const root = S.tab === 'practice' ? $('#pCard') : S.tab === 'test' ? $('#tCard') : null;
  const b = root && root.querySelector(`.opt[data-letter="${l}"]`);
  if (b && !b.disabled) b.click();
});

async function loadTheory() { S.theory = await api('/api/theory?' + qs({ language: S.lang })); }

async function init() {
  $('#lang').value = S.lang;
  applyModes(); applyStatic(); pomoDraw();
  try {
    const st = await api('/api/status');
    const pill = $('#status');
    pill.textContent = st.mock ? 'MOCK' : st.llm ? 'LLM ✓' : 'LLM ✗';
    pill.className = 'pill ' + (st.mock ? 'mock' : st.llm ? 'up' : 'down');
    await loadTheory();
    const pr = await api('/api/progress');
    if (store.get('level', null) === null) S.level = pr.current_level;
    S.topic = ''; applyStatic(); $('#level').value = String(S.level);
    refreshProgress(); renderLearn();
    await loadPractice(true);
  } catch (e) { $('#pCard').replaceChildren(el('div', { class: 'feedback bad' }, e.message)); }
}
init();
})();
</script>
</body>
